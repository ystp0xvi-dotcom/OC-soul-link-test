<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF3E1">
<title>你与TA之间｜创作者与OC的灵魂链接测试</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#9D1C0A;
  --teal-deep:#9D1C0A;
  --pink:#6E7986;
  --pink-deep:#57616C;
  --peach:#F2EFE0;
  --peach-deep:#F9D991;
  --blue:#C9DDF5;
  --white:#FFFFFF;
  --ink:#3A2318;
  --muted:#A8907A;
  --bg:#FBF8EE;
  --paper:#FFFEFA;
  --line:#EFE2C8;
  --shadow:0 18px 46px rgba(122,50,30,.14);
  --r-lg:28px;
  --r-md:20px;
  --r-sm:14px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--ink);
  font-family:'Noto Sans SC',-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  line-height:1.65;
  -webkit-tap-highlight-color:transparent;
}
h1,h2,h3{font-family:'Noto Serif SC','Noto Sans SC',sans-serif}
button{font:inherit}
.wrap{width:min(480px,100%);margin:0 auto;padding:20px 16px 40px}
.hidden{display:none!important}

.eyebrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--teal-deep);font-weight:700}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;box-shadow:var(--shadow)}

.btn{border:none;border-radius:999px;padding:15px 20px;font-weight:700;font-size:15px;cursor:pointer;width:100%;transition:.15s;letter-spacing:.01em}
.btn-primary{background:var(--teal-deep);color:#fff}
.btn-primary:active{transform:scale(.98)}
.btn-primary:disabled{opacity:.32;cursor:not-allowed}
.btn-ghost{background:var(--white);color:var(--ink);border:1.5px solid var(--line)}
.btn-ghost:active{transform:scale(.98)}
.btn-row{display:flex;gap:10px;margin-top:14px}
.btn-row .btn{flex:1}

.cover-top{padding:32px 2px 6px;text-align:center}
.cover-top h1{font-size:clamp(30px,9.5vw,40px);font-weight:900;letter-spacing:.02em;margin:0;line-height:1.3}
.cover-top .subtitle{font-size:14px;color:var(--teal-deep);font-weight:700;margin:10px 0 0}
.cover-desc{color:#6B5642;font-size:13px;margin:14px auto 0;max-width:320px;text-align:center}

.name-card{margin-top:26px;background:var(--teal);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow)}
.name-card .eyebrow{color:#FBE3D8}
.name-card h3{color:#fff;font-size:16px;margin:6px 0 14px;font-weight:700;font-family:'Noto Sans SC',sans-serif}
.field{margin-bottom:12px}
.field label{display:block;font-size:11.5px;color:#FBE3D8;margin-bottom:6px;letter-spacing:.04em}
.field input{width:100%;border:none;border-radius:14px;padding:13px 14px;font-size:15px;font-weight:600;background:rgba(255,255,255,.94);color:var(--ink)}
.field input::placeholder{color:#ab9d7f;font-weight:500}
.name-card .btn{margin-top:6px;background:var(--blue);color:var(--teal-deep)}

.progressBox{position:sticky;top:0;z-index:20;background:rgba(251,248,238,.92);backdrop-filter:blur(12px);padding:12px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px}
.progressTop{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--muted);margin-bottom:7px}
.bar{height:5px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;transition:.35s;background:var(--teal)}

.qcard{margin-top:14px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;box-shadow:var(--shadow)}
.qnum{font-size:11px;color:#b3a17e;margin-bottom:10px}
.question{font-size:18px;line-height:1.55;font-weight:700;letter-spacing:-.01em;margin:2px 0 18px}
.option{width:100%;text-align:left;border:1.5px solid var(--line);background:#FFFEFA;border-radius:16px;padding:13px 14px;margin:8px 0;cursor:pointer;display:flex;align-items:flex-start;gap:11px;color:var(--ink);transition:.15s}
.option:active{transform:scale(.99)}
.option .idx{flex:none;width:24px;height:24px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted)}
.option.selected{background:#F7ECD8;border-color:var(--teal)}
.option.selected .idx{background:var(--teal);color:#fff}

.res-hero{margin-top:6px;text-align:center;padding:8px 4px 4px}
.res-hero .eyebrow{color:var(--pink-deep);font-size:12px}
.res-hero h2{font-size:clamp(28px,9vw,36px);font-weight:900;letter-spacing:.03em;margin:10px 0 4px;color:var(--teal-deep)}
.res-hero .pair{font-size:12px;color:var(--muted);margin:0 0 6px}
.res-hero .tagline{font-size:13.5px;color:#6B5642;margin:0 auto;max-width:300px;line-height:1.7}
.kw-row{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:12px}
.kw-row span{background:var(--peach);color:var(--pink-deep);font-size:11.5px;font-weight:700;padding:5px 12px;border-radius:999px}

.sectionTitle{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--teal-deep);font-weight:800;margin:26px 2px 10px}

.info-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);padding:17px 18px;margin-bottom:10px}
.info-card p{margin:0;font-size:13.5px;color:#4A3524;line-height:1.8}

.dim-block{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);padding:15px 16px;margin-bottom:10px}
.dim-head{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:8px}
.dim-name{font-size:13.5px;font-weight:700;color:var(--ink);margin-bottom:8px}
.meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:4px}
.meter i{display:block;height:100%;border-radius:99px;background:var(--teal)}
.dim-block.mode .meter i{background:var(--pink)}
.dim-pct{text-align:right;font-size:11px;color:var(--muted);font-weight:700}
.dim-note{font-size:11.5px;color:#8a7660;margin-top:6px;line-height:1.6}

.role-card{background:var(--peach);border-radius:var(--r-md);padding:16px 18px;margin-bottom:10px;text-align:center}
.role-card .role-name{font-size:17px;font-weight:800;color:var(--teal-deep);margin-bottom:4px}
.role-card p{margin:0;font-size:12.5px;color:#6B5642}

.direction-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);padding:16px 18px;margin-bottom:10px}
.direction-row{display:flex;gap:8px;margin:6px 0;font-size:13px}
.direction-row b{flex:none;width:70px;color:var(--teal-deep);font-weight:700}
.direction-row span{color:#4A3524}

.prompt-list{list-style:none;margin:0;padding:0}
.prompt-list li{display:flex;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 15px;margin-bottom:9px;font-size:13px;color:#4A3524}
.prompt-list li .n{flex:none;width:20px;height:20px;border-radius:50%;background:var(--teal);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;margin-top:1px}

.quote-card{background:var(--teal-deep);border-radius:var(--r-md);padding:18px 20px;margin-bottom:10px;text-align:center}
.quote-card p{margin:0;color:#fff;font-size:14px;font-style:italic;line-height:1.7;font-family:'Noto Serif SC',serif}

.reminder-card{background:var(--peach);border-radius:var(--r-md);padding:15px 18px;margin-bottom:10px}
.reminder-card p{margin:0;font-size:12.5px;color:#6B5642;line-height:1.7}

.egg-card{margin-top:8px;background:var(--peach);border:2px solid var(--teal-deep);border-radius:32px;padding:24px 20px;position:relative;overflow:hidden}
.egg-card::before{content:'';position:absolute;top:-30px;right:-30px;width:80px;height:80px;background:var(--teal);border-radius:50%;opacity:.15}
.egg-card::after{content:'';position:absolute;bottom:-24px;left:-24px;width:60px;height:60px;background:var(--blue);border-radius:50%;opacity:.5}
.egg-small{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--pink-deep);font-weight:700;text-align:center;position:relative}
.egg-title{font-size:20px;font-weight:900;color:var(--teal-deep);text-align:center;margin:8px 0 10px;font-family:'Noto Serif SC',serif;position:relative}
.egg-prompt{font-size:12px;color:#8a7660;font-style:italic;text-align:center;margin:0 0 16px;line-height:1.7;position:relative}
.egg-core{background:#fff;border-radius:18px;padding:16px 18px;text-align:center;position:relative;box-shadow:var(--shadow)}
.egg-core p{margin:0;font-size:15px;font-weight:700;color:var(--teal-deep);line-height:1.7;font-family:'Noto Serif SC',serif}
.egg-kw{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:14px 0;position:relative}
.egg-kw span{background:#fff;color:var(--pink-deep);font-size:11px;font-weight:700;padding:4px 11px;border-radius:999px}
.egg-reveal-btn{width:100%;background:none;border:1.5px dashed var(--teal-deep);color:var(--teal-deep);border-radius:999px;padding:11px;font-size:12.5px;font-weight:700;cursor:pointer;position:relative}
.egg-hidden{margin-top:12px;font-size:12.5px;color:#6B5642;line-height:1.85;padding:14px 16px;background:#fff;border-radius:16px;position:relative}

.result-actions{display:flex;gap:10px;margin-top:20px}
.result-actions .btn{flex:1}
.copy-hint{text-align:center;font-size:11px;color:var(--muted);margin-top:8px}

.disclaimer{font-size:10.5px;color:#a8927a;text-align:center;margin-top:18px;padding:0 8px;line-height:1.8;white-space:pre-line}

.site-credit{width:min(480px,100%);margin:26px auto 4px;padding:14px 0 4px;text-align:center;color:var(--muted);font-size:12px;letter-spacing:.16em;font-weight:700}
.site-credit span{display:inline-block;padding:7px 15px;border:1px solid var(--line);border-radius:999px;background:var(--paper)}

@media(max-width:380px){
  .card,.qcard{padding:18px}
  .question{font-size:16.5px}
}
</style>
</head>
<body>
<div class="wrap" id="app">

  <!-- ============ COVER ============ -->
  <section id="screen-cover">
    <div class="cover-top">
      <h1>你与TA之间</h1>
      <p class="subtitle">创作者与OC的灵魂链接测试</p>
      <p class="cover-desc">从创作习惯、情感联结、角色边界与长期创作方式，看看你和TA究竟建立了怎样的关系。</p>
    </div>

    <div class="name-card">
      <div class="eyebrow">开始之前</div>
      <h3>先告诉我彼此的名字</h3>
      <div class="field"><label>你的昵称</label><input id="nameSelf" type="text" placeholder="例如：阿念"></div>
      <div class="field"><label>OC昵称</label><input id="nameA" type="text" placeholder="例如：沈知遥"></div>
      <button class="btn" id="startBtn">开始测试</button>
    </div>
  </section>

  <!-- ============ QUIZ ============ -->
  <section id="screen-quiz" class="hidden">
    <div class="progressBox">
      <div class="progressTop">
        <span id="whoName"></span>
        <span id="counter"></span>
      </div>
      <div class="bar"><i id="bar"></i></div>
    </div>
    <div class="qcard">
      <div class="qnum" id="qnum"></div>
      <div class="question" id="question"></div>
      <div id="options"></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" id="prevBtn">上一题</button>
      <button class="btn btn-primary" id="nextBtn" disabled>下一题</button>
    </div>
  </section>

  <!-- ============ RESULT ============ -->
  <section id="screen-result" class="hidden">
    <div id="resultBody"></div>

    <div class="result-actions">
      <button class="btn btn-ghost" id="restartBtn">重新测试</button>
      <button class="btn btn-primary" id="copyBtn">复制结果</button>
    </div>
    <div class="copy-hint" id="copyHint"></div>

    <p class="disclaimer" id="disclaimerText"></p>
  </section>

</div>

<footer class="site-credit"><span>@收藏夹里的熊</span></footer>

<script>
/* ============================================================
   《你与TA之间》—— 造物者与OC的灵魂链接测试
   9种结果 D1-D9；每题4个选项，A/B/C/D显示顺序随机，计分归属跟随选项文字不跟随显示位置。
   主计分：简单计数（每题选中的选项给对应类型+1），叠加蒙特卡洛校准偏移后取最高分，确保9型概率尽量均等。
   关系纬度(5)与创作模式(5)：各题选项附带的二级分数动态累加，归一化为百分比横条。
   ============================================================ */
const QUESTIONS=[{"q":"OC最初诞生的时候，你更接近下面哪种状态？","o":[{"t":"我脑子里已经有一个很明确的形象，想把TA完整地塑造出来。","type":"D1","d":{"zhudao":2,"xinren":1}},{"t":"我只是突然产生了一种很强烈的感觉，想把它变成一个角色。","type":"D8","d":{"qglj":2,"qgjl":-1}},{"t":"我想创造一个能够陪我走进某种故事或世界的角色。","type":"D2","d":{"yilai":2,"qgjl":1}},{"t":"我没有特别明确的目的，只是觉得这个角色突然应该出现。","type":"D9","d":{"jsz":2,"jqsy":2}}]},{"q":"写剧情时，TA突然做出了你没有预料到的选择，你通常会？","o":[{"t":"先停下来想：TA为什么会这样做？","type":"D7","d":{"jsz":2,"sjgc":1}},{"t":"如果这个选择更符合TA现在的状态，我会顺着写下去。","type":"D5","d":{"jsz":2,"xinren":2}},{"t":"把TA拉回原本的剧情轨道。","type":"D1","d":{"zhudao":2,"sdgk":2}},{"t":"觉得这个意外很有意思，直接看看它会把故事带到哪里。","type":"D9","d":{"chongtu":2,"jqsy":2}}]},{"q":"如果有人提出一个与你完全不同的TA解读，你第一反应更接近？","o":[{"t":"我会解释我为什么这样设计TA。","type":"D1","d":{"zhudao":2,"sdgk":2}},{"t":"我反而会好奇：原来别人看到的是这样的TA。","type":"D6","d":{"sjgc":2,"qgjl":1}},{"t":"如果对方说中了某些我没意识到的东西，会让我重新认识TA。","type":"D7","d":{"jsz":2,"xinren":1}},{"t":"只要不违背我心里的核心设定，怎么理解都可以。","type":"D5","d":{"jsz":1,"xinren":2}}]},{"q":"现实中情绪很复杂的时候，你最容易怎么处理TA？","o":[{"t":"把这种情绪写进TA的故事里。","type":"D8","d":{"qglj":2,"yilai":1}},{"t":"想象TA会怎么回应我。","type":"D2","d":{"qglj":2,"qgjl":-2}},{"t":"观察TA在这种情况下会做出什么选择。","type":"D7","d":{"jsz":2,"sjgc":1}},{"t":"不太会把现实情绪带进创作。","type":"D6","d":{"qgjl":2,"sjgc":2}}]},{"q":"你重新翻看早期OC设定时，最容易出现的念头是？","o":[{"t":"“当时的我怎么会这样写，好像还挺可爱的。”","type":"D5","d":{"qgjl":1,"jsz":1}},{"t":"“这里可以重新设计，让TA变得更完整。”","type":"D1","d":{"sdgk":2,"zhudao":2}},{"t":"“虽然现在的TA已经变了，但我还是舍不得最初的样子。”","type":"D4","d":{"yilai":2,"qglj":1}},{"t":"“我已经很好奇TA接下来还能变成什么样。”","type":"D9","d":{"jsz":2,"jqsy":2}}]},{"q":"如果必须用一个词形容你和TA平时的关系，你会选？","o":[{"t":"陪伴","type":"D2","d":{"yilai":2,"qglj":2}},{"t":"观察","type":"D6","d":{"qgjl":2,"sjgc":2}},{"t":"塑造","type":"D1","d":{"zhudao":2,"sdgk":2}},{"t":"拉扯","type":"D9","d":{"chongtu":2,"jqsy":2}}]},{"q":"当TA经历很痛苦的剧情时，你更可能？","o":[{"t":"心疼到想修改剧情，不希望TA真的经历这些。","type":"D4","d":{"yilai":2,"qglj":2}},{"t":"即使心疼，也会尊重这个剧情需要。","type":"D5","d":{"xinren":2,"jsz":2}},{"t":"会把这段经历写得很深，因为它可能承载了某些我想表达的东西。","type":"D8","d":{"qglj":2,"qgjl":-1}},{"t":"会很认真观察这件事会怎样改变TA。","type":"D7","d":{"jsz":2,"sjgc":2}}]},{"q":"你最喜欢给TA补充哪一类内容？","o":[{"t":"细节设定：习惯、喜好、衣服、房间、生活用品。","type":"D1","d":{"sdgk":2,"zhudao":1}},{"t":"内心活动：TA真正害怕什么、想要什么。","type":"D3","d":{"qglj":2,"qgjl":-1}},{"t":"与其他角色之间的关系变化。","type":"D4","d":{"xinren":1,"yilai":1}},{"t":"那些原本没有计划、后来突然长出来的故事。","type":"D9","d":{"jsz":2,"jqsy":2}}]},{"q":"如果有人说“这个OC其实很像你”，你更可能？","o":[{"t":"笑着承认：“可能确实有一点。”","type":"D3","d":{"qglj":2}},{"t":"觉得不完全是，TA已经是TA自己了。","type":"D5","d":{"jsz":2,"qgjl":1}},{"t":"表面否认，之后却会偷偷想很久。","type":"D8","d":{"qglj":2}},{"t":"觉得这种解读挺有意思，想看看对方具体看出了什么。","type":"D6","d":{"sjgc":2,"jsz":1}}]},{"q":"如果让TA自己选择未来的人生，你会？","o":[{"t":"希望TA最终过得比我想象中还要好。","type":"D4","d":{"yilai":2,"qglj":1}},{"t":"想知道TA真正会选择什么。","type":"D7","d":{"jsz":2,"xinren":2}},{"t":"还是会替TA保留一条自己认为最合适的道路。","type":"D1","d":{"zhudao":2,"sdgk":2}},{"t":"会有点舍不得，但也愿意看看TA自己走出去之后会变成什么。","type":"D5","d":{"jsz":2,"qglj":1}}]},{"q":"别人画了你的OC，你最在意的是？","o":[{"t":"TA有没有被画出原本的气质。","type":"D1","d":{"sdgk":2,"zhudao":1}},{"t":"对方有没有捕捉到TA某个我自己都没注意到的部分。","type":"D7","d":{"jsz":2,"sjgc":1}},{"t":"TA看起来有没有被好好对待。","type":"D4","d":{"qglj":2,"yilai":1}},{"t":"我会很好奇不同画风里的TA会是什么样子。","type":"D6","d":{"sjgc":2,"jqsy":1}}]},{"q":"如果很久没有创作TA，你最可能出现的感觉是？","o":[{"t":"有一点像少了一个固定陪伴自己的东西。","type":"D2","d":{"yilai":2,"qglj":2}},{"t":"没什么特别感觉，想起来再继续。","type":"D6","d":{"qgjl":2}},{"t":"偶尔会突然很想回去看看TA现在是什么状态。","type":"D7","d":{"jsz":1,"qglj":1}},{"t":"会觉得很多没处理完的东西一直留在那里。","type":"D8","d":{"qglj":2,"jqsy":1}}]},{"q":"如果要给TA设计一个“秘密”，你会更想设计？","o":[{"t":"一个TA自己都不愿面对的过去。","type":"D8","d":{"qglj":2,"chongtu":1}},{"t":"一个只有我知道、其他角色都不知道的细节。","type":"D2","d":{"yilai":2,"xinren":2}},{"t":"一个连我自己都不知道最后会揭开什么的秘密。","type":"D9","d":{"jsz":2,"jqsy":2}},{"t":"一个与TA核心性格形成强烈反差的秘密。","type":"D3","d":{"jqsy":2,"sjgc":1}}]},{"q":"如果TA在现实中真的站到你面前，你最想先做什么？","o":[{"t":"认真看看TA现在到底变成了什么样。","type":"D6","d":{"sjgc":2,"qgjl":1}},{"t":"问TA这些年过得好不好。","type":"D4","d":{"qglj":2,"yilai":1}},{"t":"问TA：“你为什么会做出那些我没有写过的选择？”","type":"D7","d":{"j 本测试为基于OC创作行为、角色设定习惯与主观创作体验设计的娱乐性自测工具，创作者与OC之间的关系可能随着创作阶段、世界观设定和个人体验发生变化，如果测试结果与你的实际感受不同，以你自己的创作体验为准。`;

/* ---------------- 状态 ---------------- */
const state={self:'你',name:'TA',idx:0,answers:Array(24).fill(null),shuffled:[]};
const $=s=>document.querySelector(s);
const show=id=>{['screen-cover','screen-quiz','screen-result'].forEach(s=>$('#'+s).classList.toggle('hidden',s!==id));window.scrollTo({top:0,behavior:'smooth'})};

function buildShuffledOrder(){
  // 每题生成一个打乱后的选项显示顺序（存原始下标），保证计分归属跟随文字而非显示位置
  state.shuffled = QUESTIONS.map(()=>{
    const idx=[0,1,2,3];
    for(let i=idx.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]]; }
    return idx;
  });
}

function bindUI(){
$('#startBtn').onclick=()=>{
  const s=$('#nameSelf').value.trim();
  const a=$('#nameA').value.trim();
  if(s) state.self=s;
  if(a) state.name=a;
  state.idx=0;
  buildShuffledOrder();
  show('screen-quiz'); renderQuestion();
};
}

function renderQuestion(){
  const q=QUESTIONS[state.idx];
  const order=state.shuffled[state.idx];
  const ans=state.answers[state.idx]; // 存的是"原始选项下标"
  $('#whoName').textContent=`关于 ${state.name}`;
  $('#counter').textContent=`${state.idx+1} / 24`;
  $('#bar').style.width=(state.idx/24*100)+'%';
  $('#qnum').textContent=`第 ${state.idx+1} / 24 题`;
  $('#question').textContent=q.q.replace(/TA/g, state.name);
  $('#options').innerHTML=order.map((origIdx,pos)=>{
    const o=q.o[origIdx];
    const selected = ans===origIdx;
    return `<button class="option ${selected?'selected':''}" data-orig="${origIdx}"><span class="idx">${String.fromCharCode(65+pos)}</span><span>${o.t.replace(/TA/g, state.name)}</span></button>`;
  }).join('');
  document.querySelectorAll('.option').forEach(el=>el.onclick=()=>{state.answers[state.idx]=+el.dataset.orig;renderQuestion();});
  $('#prevBtn').disabled=(state.idx===0);
  $('#nextBtn').disabled=ans===null;
  $('#nextBtn').textContent=state.idx===23?'查看测试结果':'下一题';
}

function bindQuizNav(){
$('#prevBtn').onclick=()=>{ if(state.idx>0){state.idx--;renderQuestion();} };
$('#nextBtn').onclick=()=>{
  const ans=state.answers[state.idx];
  if(ans===null)return;
  if(state.idx<23){state.idx++;renderQuestion();return;}
  showResult();
};
}

/* ---------------- 计分 ---------------- */
function computeAll(){
  const tally={}; DTYPES.forEach(d=>tally[d]=0);
  const sub={};
  REL_DIMS.concat(MODE_DIMS).forEach(d=>sub[d.key]=0);
  state.answers.forEach((choice,qi)=>{
    const o=QUESTIONS[qi].o[choice];
    tally[o.type]++;
    if(o.d){ Object.keys(o.d).forEach(k=>{ if(sub[k]!==undefined) sub[k]+=o.d[k]; }); }
  });
  return {tally, sub};
}
function decide(tally){
  let best=DTYPES[0], bestScore=-Infinity;
  DTYPES.forEach((d,i)=>{
    const s=tally[d]+(TYPE_OFFSETS[d]||0)+((i*13)%9)/10000;
    if(s>bestScore){bestScore=s; best=d;}
  });
  return best;
}
function pct(val, min, max){
  const p = Math.round((val-min)/(max-min)*100);
  return Math.max(0, Math.min(100, p));
}
function fill(t,name,self){ return t.replace(/TA/g, name).replace(/\{SELF\}/g, self); }

let eggRevealed=false;

function renderDimBlock(d, raw, cls){
  const p = pct(raw, d.min, d.max);
  return `<div class="dim-block ${cls}">
    <div class="dim-name">${d.name}</div>
    <div class="dim-head"><span>${d.left}</span><span>${d.right}</span></div>
    <div class="meter"><i style="width:${p}%"></i></div>
    <div class="dim-pct">${p}%</div>
    <div class="dim-note">${d.note}</div>
  </div>`;
}

  };
  $('#disclaimerText').textContent = DISCLAIMER;

  // 复制内容：仅包含指定模块（类型卡/关系维度对比/创作模式/关系类型分析/TA可能成为你的什么/适合创作方向/OC灵感挑战/创作提醒/免责声明）
  const relText = REL_DIMS.map(d=>`${d.name}：${pct(sub[d.key],d.min,d.max)}%（${d.left}←→${d.right}）`).join('\n');
  const modeText = MODE_DIMS.map(d=>`${d.name}：${pct(sub[d.key],d.min,d.max)}%（${d.left}←→${d.right}）`).join('\n');
  window._resultText = `《你与TA之间》灵魂链接测试结果\n${self} × ${name}\n\n灵魂链接类型：${t.name}\n关键词：${t.keywords.join('、')}\n${fill(t.tagline,name,self)}\n\n关系维度对比：\n${relText}\n\n创作模式：\n${modeText}\n\n关系类型分析：\n${fill(t.analysis,name,self)}\n\nTA可能成为你的什么：${t.role}——${fill(t.roleDesc,name,self)}\n\n适合创作方向：\n题材：${t.direction.题材}\n叙事方式：${t.direction.叙事}\n创作形式：${t.direction.形式}\n关键词：${t.direction.关键词}\n\nOC灵感挑战：\n${t.prompts.map((p,i)=>(i+1)+'. '+fill(p,name,self)).join('\n')}\n\n创作提醒：\n${REMINDER}\n\n${DISCLAIMER}`;

  show('screen-result');
}

function bindResult(){
$('#copyBtn').onclick=async()=>{
  const text=window._resultText||'';
  let copied=false;
  try{
    if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); copied=true; }
  }catch(e){}
  if(!copied){
    try{
      const ta=document.createElement('textarea');
      ta.value=text; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.left='-9999px'; ta.style.top='0'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0,ta.value.length);
      copied=document.execCommand('copy'); document.body.removeChild(ta);
    }catch(e){}
  }
  $('#copyHint').textContent=copied?'已复制到剪贴板 ✓':'复制失败，请长按结果文字手动复制';
  setTimeout(()=>$('#copyHint').textContent='',2200);
};
$('#restartBtn').onclick=()=>{
  state.idx=0; state.answers=Array(24).fill(null);
  show('screen-cover');
};
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', ()=>{bindUI(); bindQuizNav(); bindResult();});
}else{
  bindUI(); bindQuizNav(); bindResult();
}
</script>
</body>
</html>
